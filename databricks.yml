# Databricks Asset Bundle config (optional).
# Weather embeddings are usually run ad-hoc:
#   python notebooks/ingest_weather_embeddings.py
# You can add a Workflow later that points at that script/notebook.

bundle:
  name: databricks-lakebase-weather

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://<your-workspace-instance>.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://<your-workspace-instance>.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
