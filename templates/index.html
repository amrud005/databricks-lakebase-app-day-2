<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather Intelligence</title>
  <style>
    :root {
      --bg: #e8f1f8;
      --bg-accent: #cfe0ee;
      --card-bg: #ffffff;
      --border: #b7c9d8;
      --text: #1a2b3c;
      --muted: #5a6f82;
      --accent: #0b6e99;
      --accent-hover: #095a7d;
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: "Source Sans 3", "IBM Plex Sans", "Segoe UI", sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px 48px;
      color: var(--text);
      background:
        radial-gradient(ellipse at top, #f7fbfe 0%, var(--bg) 45%, var(--bg-accent) 100%);
      min-height: 100vh;
    }

    h1 {
      font-family: "Fraunces", "Source Serif 4", Georgia, serif;
      font-size: 32px;
      font-weight: 700;
      margin: 0 0 6px;
      letter-spacing: -0.02em;
    }

    .hint {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 28px;
    }

    section {
      margin-top: 28px;
    }

    section h2 {
      font-size: 18px;
      margin: 0 0 10px;
      font-weight: 600;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--muted);
    }

    textarea, input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font: inherit;
      background: #fff;
      color: var(--text);
    }

    textarea {
      min-height: 88px;
      resize: vertical;
    }

    .row {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .row > div { flex: 1; min-width: 120px; }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 10px 18px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: wait; }

    .status {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
      min-height: 1.2em;
    }

    .status.error { color: #b42318; }

    #results {
      list-style: none;
      padding: 0;
      margin: 16px 0 0;
    }

    #results li {
      padding: 14px 0;
      border-top: 1px solid var(--border);
    }

    #results li:first-child { border-top: none; }

    .meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .headline {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .chunk {
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .loc-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .loc-chips button.chip {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--border);
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 500;
    }

    .loc-chips button.chip.selected {
      background: #d9eef7;
      border-color: var(--accent);
    }

    .search-actions {
      margin-top: 12px;
      display: flex;
      justify-content: flex-end;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <h1>Weather Intelligence</h1>
  <p class="hint">
    Ask about weather risks and forecasts for your cities.
  </p>

  <section>
    <h2>Ask a question</h2>
    <form id="search-form">
      <label for="query">Your question</label>
      <textarea
        id="query"
        name="query"
        placeholder="Will there be flooding in Chicago this weekend?"
        required
      ></textarea>
      <div class="search-actions">
        <button type="submit" id="search-btn">Search</button>
      </div>
    </form>
    <p class="status" id="search-status"></p>
    <ul id="results"></ul>
  </section>

  <section>
    <h2>Refresh weather</h2>
    <p class="hint" style="margin-bottom: 12px;">
      Choose cities to pull the latest alerts and forecasts.
    </p>
    <label>Cities</label>
    <div class="loc-chips" id="loc-chips">
      {% for loc in known_locations %}
      <button type="button" class="chip" data-loc="{{ loc }}">{{ loc }}</button>
      {% endfor %}
    </div>
    <div class="search-actions" style="margin-top: 12px;">
      <button type="button" id="sync-btn">Refresh weather</button>
    </div>
    <p class="status" id="sync-status"></p>
  </section>

  <script>
    const selected = new Set();
    const chips = document.getElementById("loc-chips");
    const searchForm = document.getElementById("search-form");
    const searchStatus = document.getElementById("search-status");
    const resultsEl = document.getElementById("results");
    const syncBtn = document.getElementById("sync-btn");
    const syncStatus = document.getElementById("sync-status");

    function sourceLabel(sourceType) {
      if (sourceType === "alert") return "Alert";
      if (sourceType === "forecast") return "Forecast";
      return sourceType || "";
    }

    function matchLabel(similarity) {
      if (similarity == null || Number.isNaN(Number(similarity))) return "";
      const score = Number(similarity);
      if (score >= 0.55) return "Strong match";
      if (score >= 0.35) return "Good match";
      return "Related";
    }

    chips.addEventListener("click", (e) => {
      const btn = e.target.closest("button.chip");
      if (!btn) return;
      const loc = btn.dataset.loc;
      if (selected.has(loc)) {
        selected.delete(loc);
        btn.classList.remove("selected");
      } else {
        selected.add(loc);
        btn.classList.add("selected");
      }
    });

    searchForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const query = document.getElementById("query").value.trim();
      const btn = document.getElementById("search-btn");
      btn.disabled = true;
      searchStatus.textContent = "Searching...";
      searchStatus.classList.remove("error");
      resultsEl.innerHTML = "";

      try {
        const resp = await fetch("/weather/search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, top_k: 5 }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          throw new Error(data.error || resp.statusText);
        }
        if (data.message && (!data.results || data.results.length === 0)) {
          searchStatus.textContent = data.message;
          return;
        }
        const count = (data.results || []).length;
        searchStatus.textContent = count
          ? `Found ${count} answer${count === 1 ? "" : "s"}`
          : "No matching weather updates found.";
        for (const r of data.results || []) {
          const li = document.createElement("li");
          const metaParts = [
            r.location || "",
            sourceLabel(r.source_type),
            matchLabel(r.similarity),
          ].filter(Boolean);
          li.innerHTML = `
            <div class="meta">${escapeHtml(metaParts.join(" · "))}</div>
            <div class="headline">${escapeHtml(r.headline || "")}</div>
            <div class="chunk">${escapeHtml(r.chunk_text || "")}</div>
          `;
          resultsEl.appendChild(li);
        }
      } catch (err) {
        searchStatus.textContent = String(err.message || err);
        searchStatus.classList.add("error");
      } finally {
        btn.disabled = false;
      }
    });

    syncBtn.addEventListener("click", async () => {
      if (selected.size === 0) {
        syncStatus.textContent = "Select at least one city.";
        syncStatus.classList.add("error");
        return;
      }
      syncBtn.disabled = true;
      syncStatus.classList.remove("error");
      syncStatus.textContent = "Refreshing weather...";
      try {
        const resp = await fetch("/weather/sync", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ locations: [...selected], limit: 50 }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          throw new Error(data.error || resp.statusText);
        }
        const places = (data.locations || []).join(", ");
        syncStatus.textContent = `Updated weather for ${places}.`;
      } catch (err) {
        syncStatus.textContent = String(err.message || err);
        syncStatus.classList.add("error");
      } finally {
        syncBtn.disabled = false;
      }
    });

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
